services:
  xlab-nvr:
    image: ghcr.io/cjng20u/xlab-nvr:latest
    container_name: xlab-nvr
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - TZ=America/New_York
      - DATA_DIR=/data
      - RECORDINGS_DIR=/app/recordings
      # Login: create the admin account here, or leave these out and use the first-run screen.
      # - NVR_ADMIN_USER=admin
      # - NVR_ADMIN_PASSWORD=choose-a-long-password
      # Behind one reverse proxy (Caddy / Cloudflare Tunnel)? Uncomment so rate limiting sees real IPs:
      # - TRUST_PROXY=1
    volumes:
      # Where recordings are stored on the host. Set RECORDINGS_PATH in .env
      # (e.g. RECORDINGS_PATH=/mnt/nas-nvr for a NAS); defaults to ./recordings.
      - ${RECORDINGS_PATH:-./recordings}:/app/recordings
      - ./data:/data
